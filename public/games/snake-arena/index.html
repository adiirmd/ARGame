<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Snake Arena</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0f172a;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overflow: hidden;
  }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; height: 100%; padding: 10px; }
  #hud { color: #e2e8f0; display: flex; gap: 16px; font-size: 14px; }
  #hud b { color: #22d3ee; }
  canvas {
    background: #111827;
    border: 2px solid #334155;
    border-radius: 8px;
    max-width: 100%;
    max-height: 70vh;
    touch-action: none;
  }
  #msg {
    color: #f8fafc; font-size: 13px; text-align: center; min-height: 18px;
  }
  #pad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 4px; }
  #pad button {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px;
    font-size: 18px; touch-action: manipulation;
  }
  #pad button:focus-visible { outline: 2px solid #22d3ee; outline-offset: 2px; }
  .empty { visibility: hidden; }
  @media (min-width: 640px) { #pad { display: none; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">Score: <b id="score">0</b> &nbsp;|&nbsp; Best: <b id="best">0</b></div>
  <canvas id="c" width="400" height="400" role="img" aria-label="Snake game board"></canvas>
  <div id="msg">Use arrow keys / WASD, or the on-screen pad. Space to pause.</div>
  <div id="pad" aria-hidden="false">
    <div class="empty"></div><button id="up" aria-label="Up">▲</button><div class="empty"></div>
    <button id="left" aria-label="Left">◀</button><div class="empty"></div><button id="right" aria-label="Right">▶</button>
    <div class="empty"></div><button id="down" aria-label="Down">▼</button><div class="empty"></div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var msgEl = document.getElementById("msg");

  var GRID = 20;
  var CELL = canvas.width / GRID;
  var snake, dir, nextDir, food, score, best, alive, paused, tickMs, timer;

  function loadBest() {
    try { return parseInt(localStorage.getItem("snake-arena-best") || "0", 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem("snake-arena-best", String(v)); } catch (e) {}
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    alive = true;
    paused = false;
    tickMs = 130;
    placeFood();
    scoreEl.textContent = "0";
    msgEl.textContent = "Use arrow keys / WASD, or the on-screen pad. Space to pause.";
    if (timer) clearInterval(timer);
    timer = setInterval(tick, tickMs);
  }

  function placeFood() {
    var ok = false;
    while (!ok) {
      food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
      ok = !snake.some(function (s) { return s.x === food.x && s.y === food.y; });
    }
  }

  function tick() {
    if (!alive || paused) return;
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      alive = false;
      best = Math.max(best, score);
      saveBest(best);
      bestEl.textContent = String(best);
      msgEl.textContent = "Game over — score " + score + ". Press Space or tap the board to restart.";
      draw();
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = String(score);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = "#111827";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#f472b6";
    ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);

    snake.forEach(function (seg, i) {
      ctx.fillStyle = i === 0 ? "#22d3ee" : "#0ea5b7";
      ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
    });

    if (!alive) {
      ctx.fillStyle = "rgba(15,23,42,0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 22px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 8);
      ctx.font = "14px system-ui, sans-serif";
      ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 16);
    }
  }

  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return; // no instant reverse
    nextDir = { x: x, y: y };
  }

  function handleKey(e) {
    switch (e.key) {
      case "ArrowUp": case "w": case "W": setDir(0, -1); e.preventDefault(); break;
      case "ArrowDown": case "s": case "S": setDir(0, 1); e.preventDefault(); break;
      case "ArrowLeft": case "a": case "A": setDir(-1, 0); e.preventDefault(); break;
      case "ArrowRight": case "d": case "D": setDir(1, 0); e.preventDefault(); break;
      case " ":
        e.preventDefault();
        if (!alive) { reset(); return; }
        paused = !paused;
        msgEl.textContent = paused ? "Paused. Press Space to resume." : "";
        break;
    }
  }

  document.addEventListener("keydown", handleKey);
  canvas.addEventListener("click", function () { if (!alive) reset(); });

  document.getElementById("up").addEventListener("click", function () { setDir(0, -1); });
  document.getElementById("down").addEventListener("click", function () { setDir(0, 1); });
  document.getElementById("left").addEventListener("click", function () { setDir(-1, 0); });
  document.getElementById("right").addEventListener("click", function () { setDir(1, 0); });

  // basic swipe support
  var touchStart = null;
  canvas.addEventListener("touchstart", function (e) {
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener("touchend", function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else if (Math.abs(dy) > 10) {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, { passive: true });

  best = loadBest();
  bestEl.textContent = String(best);
  reset();
})();
</script>
</body>
</html>
